<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <span class="brand-icon">🍱</span>
      <span class="brand-name">Food Charity</span>
    </div>
    <button class="hamburger" (click)="toggleMenu()">☰</button>
    <ul class="nav-links" [class.open]="menuOpen">
      <li><a routerLink="/" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact:true}">Home</a></li>
      <li><a routerLink="/menu" routerLinkActive="active">Monthly Menu</a></li>
      <li><a routerLink="/donors" routerLinkActive="active">Donors</a></li>
      <li *ngIf="authService.isLoggedIn()">
        <a routerLink="/admin" routerLinkActive="active">Admin</a>
      </li>
      <li *ngIf="!authService.isLoggedIn()">
        <a routerLink="/login" routerLinkActive="active" class="login-link">🔐 Login</a>
      </li>
      <li *ngIf="authService.isLoggedIn()">
        <button class="logout-btn" (click)="logout()">
          👋 Logout ({{ authService.getUsername() }})
        </button>
      </li>
    </ul>
  </div>
</nav>
