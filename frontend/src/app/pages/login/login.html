<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <div class="login-logo">🍱</div>
      <h1>Admin Login</h1>
      <p>Food Charity Management System</p>
    </div>

    <div class="login-form">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            type="text"
            [(ngModel)]="username"
            placeholder="Enter username"
            [class.error-input]="errors.username"
            (keyup.enter)="login()" />
        </div>
        <span class="error-msg" *ngIf="errors.username">{{ errors.username }}</span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="Enter password"
            [class.error-input]="errors.password"
            (keyup.enter)="login()" />
          <button class="toggle-password" (click)="togglePassword()">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <span class="error-msg" *ngIf="errors.password">{{ errors.password }}</span>
      </div>

      <button class="login-btn" (click)="login()" [disabled]="loading">
        <span *ngIf="!loading">🔐 Login</span>
        <span *ngIf="loading">⏳ Logging in...</span>
      </button>

      <div class="login-hint">
        <p>🔑 Default credentials</p>
        <p>Username: <strong>admin</strong> | Password: <strong>admin123</strong></p>
      </div>
    </div>

  </div>

  <div class="login-bg">
    <div class="bg-quote">
      <p>❝ Love All, Serve All ❞</p>
      <span>— Sri Sathya Sai Baba</span>
    </div>
  </div>
</div>
